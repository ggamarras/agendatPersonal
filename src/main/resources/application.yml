server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:vaultappdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

app:
  vault:
    addr: http://localhost:8200
    # Este token se usa sólo para operaciones que requieran lectura de alguna config. Para login usamos userpass directo.
    adminToken: ${VAULT_TOKEN:}
    # Si en Docker las redes difieren, ajusta addr al hostname del servicio vault.