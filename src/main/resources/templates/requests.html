<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bandeja de solicitudes</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<h2>Bandeja de solicitudes</h2>
<a th:href="@{/logout}">Cerrar sesión</a>

<table border="1">
    <thead>
    <tr>
        <th>ID</th><th>Nombre</th><th>Apellido</th>
        <th>Dirección</th><th>Teléfono</th><th>Estado</th><th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="e : ${entries}">
        <td th:text="${e.id}"></td>
        <td th:text="${e.nombre}"></td>
        <td th:text="${e.apellido}"></td>
        <td th:text="${e.direccion}"></td>
        <td th:text="${e.telefono}"></td>
        <td th:text="${e.status}"></td>
        <td>
            <!-- Aprobar/Rechazar: solo Aprobador y Administrador -->
            <form th:action="@{'/requests/' + ${e.id} + '/approve'}" method="post"
                  th:if="${isAdmin or isAprobador}">
                <button type="submit">Aprobar</button>
            </form>
            <form th:action="@{'/requests/' + ${e.id} + '/reject'}" method="post"
                  th:if="${isAdmin or isAprobador}">
                <button type="submit">Rechazar</button>
            </form>

            <!-- Editar: solo Administrador -->
            <a th:href="@{'/requests/' + ${e.id} + '/edit'}" th:if="${isAdmin}">Modificar</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
